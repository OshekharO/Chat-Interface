<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface - Interactive Multi-Model Assistant</title>
    <meta name="description" content="An interactive AI chat interface supporting multiple AI model engines for real-time natural language conversations.">
    <link rel="canonical" href="https://saksham.thedev.id/Chat-Interface/">

    <!-- Performance Optimizations: Preconnect to external origins & pre-fetch Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://gpt-ai-topaz.vercel.app">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://saksham.thedev.id/Chat-Interface/">
    <meta property="og:title" content="AI Chat Interface - Interactive Multi-Model Assistant">
    <meta property="og:description" content="An interactive AI chat interface supporting multiple AI model engines for real-time natural language conversations.">
    <meta property="og:site_name" content="AI Chat Interface">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="AI Chat Interface - Interactive Multi-Model Assistant">
    <meta name="twitter:description" content="An interactive AI chat interface supporting multiple AI model engines for real-time natural language conversations.">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://saksham.thedev.id/Chat-Interface/#website",
          "url": "https://saksham.thedev.id/Chat-Interface/",
          "name": "AI Chat Interface",
          "description": "Interactive AI chat interface supporting multiple AI model engines for real-time conversations."
        },
        {
          "@type": "WebApplication",
          "@id": "https://saksham.thedev.id/Chat-Interface/#webapplication",
          "url": "https://saksham.thedev.id/Chat-Interface/",
          "name": "AI Chat Interface",
          "applicationCategory": "UtilityApplication",
          "operatingSystem": "All",
          "browserRequirements": "Requires JavaScript. Requires HTML5."
        }
      ]
    }
    </script>
    <style>
        /* Google Fonts loaded via <link> tags in <head> for parallel non-blocking fetching */

        /* ==========================================================================
           Design Tokens / Visual System
           ========================================================================== */
        :root {
            /* Color Tokens - Dark Mode Default */
            --bg-app: #202123;
            --bg-surface: #2b2c36;
            --bg-header: #202123;
            --bg-user-msg: #343541;
            --bg-bot-msg: #444654;
            --bg-input-area: #202123;
            --bg-input-box: #40414f;
            --bg-input-box-hover: #4e4f60;
            --bg-badge: #2d2f3d;

            --border-subtle: #4e4f60;
            --border-strong: #565869;
            --border-focus: #10a37f;

            --text-primary: #ffffff;
            --text-secondary: #c5c5d2;
            --text-muted: #8e8ea0;
            --text-inverse: #202123;

            --accent-primary: #10a37f;
            --accent-hover: #1a7f64;
            --accent-active: #0d8a6a;
            --accent-light: rgba(16, 163, 127, 0.15);

            --avatar-user-bg: #5c5c7b;
            --avatar-bot-bg: #10a37f;

            /* Spacing Scale */
            --spacing-2xs: 0.25rem;  /* 4px */
            --spacing-xs:  0.5rem;   /* 8px */
            --spacing-sm:  0.75rem;  /* 12px */
            --spacing-md:  1rem;     /* 16px */
            --spacing-lg:  1.25rem;  /* 20px */
            --spacing-xl:  1.5rem;   /* 24px */
            --spacing-2xl: 2rem;     /* 32px */

            /* Typography Tokens */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-size-xs: 0.75rem;   /* 12px */
            --font-size-sm: 0.875rem;  /* 14px */
            --font-size-md: 1rem;      /* 16px */
            --font-size-lg: 1.125rem;  /* 18px */
            --font-size-xl: 1.5rem;    /* 24px */

            --weight-regular: 400;
            --weight-medium: 500;
            --weight-semibold: 600;
            --weight-bold: 700;

            --line-height-tight: 1.25;
            --line-height-normal: 1.5;
            --line-height-relaxed: 1.625;

            /* Border Radii */
            --radius-sm: 0.375rem;   /* 6px */
            --radius-md: 0.5rem;     /* 8px */
            --radius-lg: 0.75rem;    /* 12px */
            --radius-xl: 1rem;       /* 16px */
            --radius-full: 9999px;

            /* Elevation & Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.35);

            /* Transitions */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        /* Light Mode Theme Overrides */
        [data-theme="light"] {
            --bg-app: #ffffff;
            --bg-surface: #f7f7f8;
            --bg-header: #ffffff;
            --bg-user-msg: #ffffff;
            --bg-bot-msg: #f7f7f8;
            --bg-input-area: #ffffff;
            --bg-input-box: #f4f4f6;
            --bg-input-box-hover: #e5e5e9;
            --bg-badge: #ececf1;

            --border-subtle: #e5e5e5;
            --border-strong: #d9d9e3;
            --border-focus: #10a37f;

            --text-primary: #202123;
            --text-secondary: #444654;
            --text-muted: #8e8ea0;
            --text-inverse: #ffffff;

            --avatar-user-bg: #5436da;
            --avatar-bot-bg: #10a37f;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background-color var(--transition-normal), color var(--transition-normal);
        }

        /* ==========================================================================
           App Header Component
           ========================================================================== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-sm) var(--spacing-xl);
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-subtle);
            height: 60px;
            z-index: 10;
            transition: background-color var(--transition-normal), border-color var(--transition-normal);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--accent-primary);
            color: #ffffff;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--weight-bold);
            font-size: var(--font-size-sm);
        }

        .brand-title {
            font-size: var(--font-size-md);
            font-weight: var(--weight-semibold);
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        /* Theme Toggle Button */
        .theme-toggle-btn {
            background-color: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            cursor: pointer;
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: var(--weight-medium);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            transition: background-color var(--transition-fast), border-color var(--transition-fast);
        }

        .theme-toggle-btn:hover {
            background-color: var(--bg-badge);
            border-color: var(--border-strong);
        }

        .theme-toggle-btn:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        /* ==========================================================================
           Chat Container & Messages
           ========================================================================== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl) 0;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            scroll-behavior: smooth;
        }

        /* Empty / Welcome State */
        .welcome-state {
            margin: auto;
            text-align: center;
            max-width: 480px;
            padding: var(--spacing-2xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-md);
        }

        .welcome-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-full);
            background-color: var(--accent-light);
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-xl);
        }

        .welcome-title {
            font-size: var(--font-size-xl);
            font-weight: var(--weight-semibold);
            color: var(--text-primary);
        }

        .welcome-desc {
            font-size: var(--font-size-sm);
            color: var(--text-muted);
            line-height: var(--line-height-normal);
        }

        /* Message Component */
        .message-row {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: var(--spacing-lg) var(--spacing-md);
            transition: background-color var(--transition-normal);
        }

        .message-row.user-row {
            background-color: var(--bg-user-msg);
        }

        .message-row.bot-row {
            background-color: var(--bg-bot-msg);
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
        }

        .message-wrapper {
            max-width: 48rem;
            width: 100%;
            display: flex;
            gap: var(--spacing-md);
            align-items: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--weight-semibold);
            font-size: var(--font-size-xs);
            color: #ffffff;
            flex-shrink: 0;
        }

        .user-row .message-avatar {
            background-color: var(--avatar-user-bg);
        }

        .bot-row .message-avatar {
            background-color: var(--avatar-bot-bg);
        }

        .message-content {
            flex: 1;
            line-height: var(--line-height-relaxed);
            font-size: var(--font-size-md);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            padding-top: 2px;
        }

        /* Loading / Thinking State Animation */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: var(--radius-full);
            background-color: var(--text-muted);
            animation: pulse 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        /* ==========================================================================
           Input Area Component
           ========================================================================== */
        .input-area {
            background-color: var(--bg-input-area);
            padding: var(--spacing-md) var(--spacing-lg) var(--spacing-lg);
            position: sticky;
            bottom: 0;
            border-top: 1px solid var(--border-subtle);
            transition: background-color var(--transition-normal), border-color var(--transition-normal);
        }

        .input-container {
            display: flex;
            align-items: flex-end;
            max-width: 48rem;
            margin: 0 auto;
            background-color: var(--bg-input-box);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-normal);
            padding: var(--spacing-2xs) var(--spacing-xs);
        }

        .input-container:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px var(--accent-light), var(--shadow-md);
        }

        /* Custom Select Styling */
        .engine-select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        #engine-select {
            appearance: none;
            -webkit-appearance: none;
            background-color: var(--bg-badge);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--spacing-xs) var(--spacing-xl) var(--spacing-xs) var(--spacing-sm);
            font-size: var(--font-size-xs);
            font-weight: var(--weight-medium);
            cursor: pointer;
            transition: background-color var(--transition-fast), color var(--transition-fast);
        }

        #engine-select:hover {
            color: var(--text-primary);
            border-color: var(--border-strong);
        }

        #engine-select:focus-visible {
            outline: 2px solid var(--border-focus);
        }

        .select-arrow {
            position: absolute;
            right: 8px;
            pointer-events: none;
            color: var(--text-muted);
            font-size: 10px;
        }

        /* Textarea Input */
        #chat-input {
            flex: 1;
            background-color: transparent;
            border: none;
            color: var(--text-primary);
            font-size: var(--font-size-md);
            line-height: var(--line-height-normal);
            padding: var(--spacing-sm);
            resize: none;
            min-height: 48px;
            max-height: 200px;
            overflow-y: auto;
        }

        #chat-input::placeholder {
            color: var(--text-muted);
        }

        #chat-input:focus {
            outline: none;
        }

        /* Send Button */
        #send-btn {
            background-color: var(--accent-primary);
            border: none;
            color: #ffffff;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            margin-right: 4px;
            transition: background-color var(--transition-fast), transform var(--transition-fast), opacity var(--transition-fast);
            flex-shrink: 0;
        }

        #send-btn:hover {
            background-color: var(--accent-hover);
        }

        #send-btn:active {
            background-color: var(--accent-active);
            transform: scale(0.96);
        }

        #send-btn:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        #send-btn:disabled {
            background-color: var(--bg-badge);
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        #send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Footer Info */
        .input-footer-text {
            text-align: center;
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            margin-top: var(--spacing-xs);
        }

        /* Responsive Adjustments */
        @media (max-width: 640px) {
            .app-header {
                padding: var(--spacing-sm) var(--spacing-md);
            }

            .chat-container {
                padding: var(--spacing-md) 0;
            }

            .message-row {
                padding: var(--spacing-md) var(--spacing-sm);
            }

            .input-area {
                padding: var(--spacing-xs) var(--spacing-sm) var(--spacing-sm);
            }
        }
    </style>
</head>
<body>
    <!-- App Header -->
    <header class="app-header">
        <div class="header-brand">
            <div class="brand-icon">🤖</div>
            <h1 class="brand-title">AI Assistant</h1>
        </div>
        <div class="header-actions">
            <button id="theme-btn" class="theme-toggle-btn" aria-label="Toggle visual theme">
                <span id="theme-icon">🌙</span>
                <span id="theme-label">Dark</span>
            </button>
        </div>
    </header>

    <!-- Chat Messages Container -->
    <main class="chat-container" id="chat-container">
        <div class="welcome-state" id="welcome-state">
            <div class="welcome-icon">💬</div>
            <h2 class="welcome-title">How can I help you today?</h2>
            <p class="welcome-desc">Select an AI model version from the menu below and type a message to start a conversation.</p>
        </div>
    </main>
    
    <!-- Input Sticky Bar -->
    <div class="input-area">
        <div class="input-container">
            <div class="engine-select-wrapper">
                <select id="engine-select" aria-label="Select AI Engine Model">
                    <option value="v1">v1</option>
                    <option value="v2">v2</option>
                    <option value="v3">v3</option>
                    <option value="v4">v4</option>
                    <option value="v5">v5</option>
                    <option value="v6">v6</option>
                    <option value="v7">v7</option>
                    <option value="v8">v8</option>
                    <option value="v9">v9</option>
                    <option value="v10">v10</option>
                    <option value="v11">v11</option>
                    <option value="v12">v12</option>
                </select>
                <span class="select-arrow">▼</span>
            </div>
            <textarea id="chat-input" placeholder="Send a message..." rows="1" aria-label="Message input"></textarea>
            <button id="send-btn" aria-label="Send message">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
        <p class="input-footer-text">AI may produce inaccurate information. Verify critical details.</p>
    </div>

    <script>
        let currentTheme = 'dark';

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById("theme-icon");
            const themeLabel = document.getElementById("theme-label");

            if (currentTheme === 'dark') {
                currentTheme = 'light';
                html.setAttribute("data-theme", "light");
                themeIcon.textContent = "☀️";
                themeLabel.textContent = "Light";
            } else {
                currentTheme = 'dark';
                html.setAttribute("data-theme", "dark");
                themeIcon.textContent = "🌙";
                themeLabel.textContent = "Dark";
            }
        }

        async function create(prompt, apiVersion) {
            const url = `https://gpt-ai-topaz.vercel.app/chat/${apiVersion}`;

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ userMessage: prompt }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data.reply;
            } catch (error) {
                console.error("Error:", error);
                return "Sorry, there was an error processing your request.";
            }
        }

        async function sendMessage() {
            const chatInput = document.getElementById("chat-input");
            const prompt = chatInput.value.trim();
            if (!prompt) return;

            const apiVersion = document.getElementById("engine-select").value;
            const chatContainer = document.getElementById("chat-container");
            const welcomeState = document.getElementById("welcome-state");

            // Remove welcome placeholder if visible
            if (welcomeState) {
                welcomeState.remove();
            }

            // Create User Message Row
            const userRow = document.createElement("div");
            userRow.className = "message-row user-row";
            userRow.innerHTML = `
                <div class="message-wrapper">
                    <div class="message-avatar">You</div>
                    <div class="message-content"></div>
                </div>
            `;
            userRow.querySelector(".message-content").textContent = prompt;
            chatContainer.appendChild(userRow);

            // Create Bot Thinking Message Row
            const botRow = document.createElement("div");
            botRow.className = "message-row bot-row";
            botRow.innerHTML = `
                <div class="message-wrapper">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        <div class="typing-indicator">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(botRow);

            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Reset input field height & value
            chatInput.value = "";
            chatInput.style.height = "auto";

            // Send request and update bot message content
            const resp = await create(prompt, apiVersion);
            const botContent = botRow.querySelector(".message-content");
            botContent.textContent = resp;

            // Scroll to bottom again
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        document.getElementById("send-btn").addEventListener("click", sendMessage);

        document.getElementById("chat-input").addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        document.getElementById("theme-btn").addEventListener("click", toggleTheme);

        // Auto-adjust textarea height dynamically
        const textarea = document.getElementById("chat-input");
        textarea.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 200) + "px";
        });
    </script>
</body>
</html>
